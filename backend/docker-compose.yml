# SilverTech Agent Adam — Docker Compose
# Full local development & production stack
# June 2026

version: '3.9'

services:
  # ── PostgreSQL + pgvector ──────────────────────────────
  postgres:
    image: pgvector/pgvector:pg17
    container_name: adam-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-adam}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-adam_dev_2026}
      POSTGRES_DB: ${DB_NAME:-agent_adam}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./prisma/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adam -d agent_adam"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - adam_network
    restart: unless-stopped

  # ── Redis for BullMQ & caching ────────────────────────
  redis:
    image: redis:7-alpine
    container_name: adam-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - adam_network
    restart: unless-stopped

  # ── Backend API ───────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: adam-backend
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://${DB_USER:-adam}:${DB_PASSWORD:-adam_dev_2026}@postgres:5432/${DB_NAME:-agent_adam}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-silvertech-adam-jwt-secret-2026}
      # Twilio
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER}
      # Deepgram
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY}
      # Gemini
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      # OpenAI TTS
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      # Hugging Face (guardrails)
      HF_API_KEY: ${HF_API_KEY}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
      - ./uploads:/app/uploads
    networks:
      - adam_network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M

  # ── BullMQ Worker ─────────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: adam-worker
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${DB_USER:-adam}:${DB_PASSWORD:-adam_dev_2026}@postgres:5432/${DB_NAME:-agent_adam}
      REDIS_URL: redis://redis:6379
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
    networks:
      - adam_network
    restart: unless-stopped
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '1'
          memory: 512M

  # ── Nginx reverse proxy ───────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: adam-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - backend
    networks:
      - adam_network
    restart: unless-stopped

  # ── Prometheus Monitoring ────────────────────────────
  prometheus:
    image: prom/prometheus:v3.0
    container_name: adam-prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    ports:
      - "9090:9090"
    networks:
      - adam_network
    restart: unless-stopped

  # ── Grafana Dashboards ────────────────────────────────
  grafana:
    image: grafana/grafana:11.0
    container_name: adam-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_INSTALL_PLUGINS: grafana-piechart-panel
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - prometheus
    networks:
      - adam_network
    restart: unless-stopped

  # ── Healthchecks.io Self-Hosted ───────────────────────
  healthchecks:
    image: healthchecks/healthchecks:v3.7
    container_name: adam-healthchecks
    environment:
      DB: postgres
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: healthchecks
      DB_USER: ${DB_USER:-adam}
      DB_PASSWORD: ${DB_PASSWORD:-adam_dev_2026}
      SECRET_KEY: ${HC_SECRET_KEY:-super-secret-key}
      DEBUG: "False"
      SITE_ROOT: https://healthchecks.silvertech.ai
      SITE_NAME: "SilverTech Health Checks"
      DEFAULT_FROM_EMAIL: alerts@silvertech.ai
      EMAIL_HOST: ${SMTP_HOST}
      EMAIL_PORT: ${SMTP_PORT:-587}
      EMAIL_HOST_USER: ${SMTP_USER}
      EMAIL_HOST_PASSWORD: ${SMTP_PASSWORD}
      EMAIL_USE_TLS: "True"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - adam_network
    restart: unless-stopped

networks:
  adam_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  nginx_logs:
  prometheus_data:
  grafana_data:
