# SilverTech Agent Adam — CI/CD Pipeline
# GitHub Actions: lint → test → build → docker → deploy
# June 2026

name: Agent Adam CI/CD

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - '.github/**'
  pull_request:
    branches: [main]
  release:
    types: [published]

env:
  FLUTTER_VERSION: '3.35.4'
  NODE_VERSION: '22'
  DOCKER_REGISTRY: ghcr.io
  DOCKER_IMAGE: ghcr.io/silvertech/agent-adam-api

jobs:
  # ── Flutter Analyze & Test ────────────────────────────
  flutter:
    name: Flutter Analyze & Test
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ./
    steps:
      - uses: actions/checkout@v4
      
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run static analysis
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run unit tests
        run: flutter test --coverage

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: coverage/lcov.info
          flags: flutter

  # ── Backend Lint & Test ───────────────────────────────
  backend:
    name: Backend Lint & Test
    runs-on: ubuntu-24.04
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/test
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Install backend dependencies
        working-directory: backend
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate

      - name: Run Prisma migrations
        working-directory: backend
        run: npx prisma migrate deploy

      - name: Run backend tests
        working-directory: backend
        run: pnpm test -- --coverage

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: backend/coverage/lcov.info
          flags: backend

  # ── Security Scan ─────────────────────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

      - name: npm audit (backend)
        working-directory: backend
        run: |
          pnpm audit --audit-level=high || true
        continue-on-error: true

  # ── Docker Build & Push ───────────────────────────────
  docker:
    name: Docker Build & Push
    needs: [flutter, backend, security]
    if: github.event_name == 'release' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,format=short

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Deploy to Production ──────────────────────────────
  deploy:
    name: Deploy to Production
    needs: [docker]
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      - name: Configure kubeconfig
        uses: azure/k8s-set-context@v4
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBECONFIG }}

      - name: Deploy to Kubernetes
        run: |
          kubectl set image deployment/adam-api \
            api=${{ env.DOCKER_IMAGE }}:${{ github.ref_name }} \
            -n agent-adam
          kubectl rollout status deployment/adam-api -n agent-adam --timeout=5m

      - name: Run database migrations
        working-directory: backend
        run: |
          npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}

      - name: Health check
        run: |
          sleep 10
          curl -f https://api.silvertech.ai/api/health || exit 1

  # ── Notify ────────────────────────────────────────────
  notify:
    name: Notify
    needs: [deploy]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Notify deployment status
        uses: slackapi/slack-github-action@v2
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "Agent Adam v${{ github.ref_name }} deployed to production",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ":rocket: *Agent Adam* v`${{ github.ref_name }}` deployed to production\n• Commit: <${{ github.event.head_commit.url }}|${{ github.sha }}>\n• Author: ${{ github.actor }}\n• Status: ${{ job.status }}"
                  }
                }
              ]
            }
