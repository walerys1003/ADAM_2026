# ─────────────────────────────────────────────────────────────────
# Agent Adam — Nginx Reverse Proxy Configuration
# SilverTech | June 2026
# ─────────────────────────────────────────────────────────────────
# Handles:
#   - TLS termination (Let's Encrypt via cert-manager)
#   - HTTP/2 & gzip compression
#   - Rate limiting (DDoS protection)
#   - WebSocket upgrade for voice calls
#   - API versioning (/api/v1/)
#   - Admin panel routing (/admin/)
#   - Health check endpoints
# ─────────────────────────────────────────────────────────────────

upstream api_backend {
    least_conn;
    server agent-adam-api.agent-adam.svc.cluster.local:3000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

upstream websocket_backend {
    ip_hash; # Sticky sessions for WebSocket
    server agent-adam-api.agent-adam.svc.cluster.local:3000 max_fails=3 fail_timeout=10s;
    keepalive 64;
}

# ─── Rate limiting zones ─────────────────────────────────────────────
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=50r/s;
limit_req_zone $binary_remote_addr zone=voice_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=admin_limit:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

# ─── Map for WebSocket upgrade ───────────────────────────────────────
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ─── Main server block ───────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name api.agentadam.pl api.staging.agentadam.pl;

    # Redirect HTTP → HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.agentadam.pl;

    # ─── TLS Configuration (Mozilla Intermediate) ──────────────────
    ssl_certificate     /etc/nginx/ssl/tls.crt;
    ssl_certificate_key /etc/nginx/ssl/tls.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # ─── Security headers ──────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ─── Gzip ──────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # ─── Logging ───────────────────────────────────────────────────
    access_log /var/log/nginx/agent-adam-access.log combined buffer=16k;
    error_log  /var/log/nginx/agent-adam-error.log warn;

    # ─── Client settings ───────────────────────────────────────────
    client_max_body_size 20m;
    client_body_timeout 30s;
    client_header_timeout 15s;

    # ─── Health check ──────────────────────────────────────────────
    location /health {
        access_log off;
        return 200 '{"status":"ok","service":"agent-adam-nginx"}\n';
        add_header Content-Type application/json;
    }

    # ─── API routes ────────────────────────────────────────────────
    location /api/v1/ {
        limit_req zone=api_limit burst=30 nodelay;
        limit_conn conn_limit 20;

        proxy_pass http://api_backend/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;

        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        proxy_buffering off;

        # CORS headers for Flutter web
        add_header Access-Control-Allow-Origin "https://agentadam.pl" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Senior-ID" always;
        add_header Access-Control-Max-Age "3600" always;

        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    # ─── Voice WebSocket routes ────────────────────────────────────
    location /api/v1/voice/ws {
        limit_req zone=voice_limit burst=5 nodelay;

        proxy_pass http://websocket_backend/api/v1/voice/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_connect_timeout 15s;
        proxy_send_timeout 600s;  # 10 min for voice calls
        proxy_read_timeout 600s;
    }

    # ─── Admin routes (restricted) ─────────────────────────────────
    location /admin/ {
        limit_req zone=admin_limit burst=15 nodelay;
        limit_conn conn_limit 10;

        # IP whitelist for admin access (configure per environment)
        # allow 10.0.0.0/8;
        # allow 172.16.0.0/12;
        # deny all;

        proxy_pass http://api_backend/admin/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ─── Metrics endpoint (Prometheus scraping) ────────────────────
    location /metrics {
        access_log off;
        # Internal only — K8s service mesh
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        deny all;

        proxy_pass http://api_backend/metrics;
    }

    # ─── Block access to sensitive paths ───────────────────────────
    location ~ /\.(git|env|htaccess) {
        deny all;
        return 404;
    }
}

# ─── Staging environment ───────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name api.staging.agentadam.pl;

    ssl_certificate     /etc/nginx/ssl/tls.crt;
    ssl_certificate_key /etc/nginx/ssl/tls.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location /api/v1/ {
        limit_req zone=api_limit burst=30 nodelay;
        proxy_pass http://api_backend/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Allow all admin access in staging
    location /admin/ {
        proxy_pass http://api_backend/admin/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
