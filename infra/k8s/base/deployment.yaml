# SilverTech Agent Adam — Kubernetes Deployment Manifest
# Production deployment on Hetzner Cloud (k3s)
# June 2026

apiVersion: v1
kind: Namespace
metadata:
  name: agent-adam
  labels:
    app: agent-adam
    environment: production

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: adam-config
  namespace: agent-adam
data:
  NODE_ENV: "production"
  LOG_LEVEL: "info"
  RATE_LIMIT_MAX: "100"
  CORS_ORIGINS: "https://silvertech.ai,https://admin.silvertech.ai,https://api.silvertech.ai"

---
apiVersion: v1
kind: Secret
metadata:
  name: adam-secrets
  namespace: agent-adam
type: Opaque
stringData:
  JWT_SECRET: "silvertech-adam-jwt-secret-2026"
  DATABASE_URL: "postgresql://adam:adam_dev_2026@postgres:5432/agent_adam"
  REDIS_URL: "redis://redis:6379"
  # In production: use External Secrets Operator or Sealed Secrets

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: adam-api
  namespace: agent-adam
  labels:
    app: adam-api
    tier: backend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: adam-api
  template:
    metadata:
      labels:
        app: adam-api
        tier: backend
        version: "1.6.0"
    spec:
      containers:
        - name: api
          image: ghcr.io/silvertech/agent-adam-api:1.6.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
              protocol: TCP
          envFrom:
            - configMapRef:
                name: adam-config
            - secretRef:
                name: adam-secrets
          env:
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "3000"
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          startupProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: adam-api
                topologyKey: kubernetes.io/hostname
      terminationGracePeriodSeconds: 30

---
apiVersion: v1
kind: Service
metadata:
  name: adam-api
  namespace: agent-adam
  labels:
    app: adam-api
spec:
  type: ClusterIP
  selector:
    app: adam-api
  ports:
    - port: 3000
      targetPort: 3000
      protocol: TCP
      name: http

---
# BullMQ Worker Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: adam-worker
  namespace: agent-adam
  labels:
    app: adam-worker
    tier: worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: adam-worker
  template:
    metadata:
      labels:
        app: adam-worker
        tier: worker
    spec:
      containers:
        - name: worker
          image: ghcr.io/silvertech/agent-adam-worker:1.6.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: adam-config
            - secretRef:
                name: adam-secrets
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001

---
# Horizontal Pod Autoscaler
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: adam-api-hpa
  namespace: agent-adam
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: adam-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

---
# Pod Disruption Budget
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: adam-api-pdb
  namespace: agent-adam
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: adam-api

---
# Ingress (Traefik / NGINX)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: adam-ingress
  namespace: agent-adam
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    traefik.ingress.kubernetes.io/router.middlewares: "agent-adam-rate-limit@kubernetescrd"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - api.silvertech.ai
        - admin.silvertech.ai
        - silvertech.ai
      secretName: adam-tls-cert
  rules:
    - host: api.silvertech.ai
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: adam-api
                port:
                  number: 3000
    - host: admin.silvertech.ai
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: adam-api
                port:
                  number: 3000
