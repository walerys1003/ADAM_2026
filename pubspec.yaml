name: senior_companion
description: Agent Adam - Przyjaciel Seniora. AI voice assistant platform by SilverTech.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.9.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management
  provider: 6.1.5+1

  # Supabase Backend
  supabase_flutter: 2.8.4

  # Local Storage
  shared_preferences: 2.5.3
  hive: 2.2.3
  hive_flutter: 1.1.0

  # Charts & Visualization
  fl_chart: 0.70.2

  # UI Components
  google_fonts: 6.2.1
  flutter_svg: 2.0.17
  shimmer: 3.0.0
  intl: 0.20.2

  # Audio Player (for conversation playback)
  audioplayers: 6.1.0

  # URL Launcher
  url_launcher: 6.3.1

  # HTTP Client
  http: 1.5.0

  # Permissions (Health Connect, Camera, Calendar)
  permission_handler: 11.3.1

  # Connectivity
  connectivity_plus: 6.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
